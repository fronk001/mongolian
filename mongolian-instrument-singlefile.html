:root{
--chassis:#0A0B0C; --panel:#15181B; --panel2:#0F1113; --track:#2A2E33;
--muted:#7C8288; --muted2:#5E646A; --dim:#3A3F45;
--ink:#EDEEEC; --ink2:#9AA0A6; --signal:#D8F04B; --alert:#FF6B4A;
--hair:rgba(255,255,255,.10); --hair2:rgba(255,255,255,.06); --hair3:rgba(255,255,255,.14);
--ease:cubic-bezier(.2,0,0,1);
color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--chassis)}
body{
font-family:'Geologica',system-ui,-apple-system,sans-serif;
color:var(--ink);font-weight:300;
min-height:100vh;-webkit-font-smoothing:antialiased;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
.mono.n{text-transform:none;letter-spacing:.06em}
.wrap{max-width:680px;margin:0 auto;padding:20px 20px 64px}

/* ---- header ---- */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
border-bottom:1px solid var(--hair);padding-bottom:16px;margin-bottom:20px}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin-top:8px}
.top .sub{font-size:13px;color:var(--muted);margin-top:5px;font-weight:300}
.top .right{text-align:right;line-height:1.9;white-space:nowrap}

/* ---- section header ---- */
.h{display:flex;justify-content:space-between;gap:12px;
padding-bottom:10px;border-bottom:1px solid var(--hair);margin-bottom:16px}
.sec{padding-bottom:28px}

/* ---- panels ---- */
.card{background:var(--panel);border:1px solid var(--hair);border-radius:4px;padding:16px}
.card+.card{margin-top:12px}

/* ---- phase rail ---- */
.rail{display:flex;gap:4px}
.rail i{flex:1;height:4px;border-radius:2px;background:var(--track);transition:background 160ms var(--ease)}
.rail i.done{background:var(--muted2)}
.rail i.now{background:var(--signal)}
.raillabels{display:flex;gap:4px;margin-top:8px}
.raillabels span{flex:1;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9px;
letter-spacing:.06em;text-transform:uppercase;color:var(--muted2)}
.raillabels span.now{color:var(--signal)}

/* ---- stat triplet ---- */
.stats{display:flex}
.stats>div{flex:1;padding-left:12px;border-right:1px solid var(--hair)}
.stats>div:first-child{padding-left:0}
.stats>div:last-child{border-right:0}
.stats .v{font-size:28px;font-weight:500;line-height:1;margin-top:6px;letter-spacing:-.02em}
.stats>div:first-child .v{color:var(--signal)}

/* ---- list rows ---- */
.rows{border:1px solid var(--hair);border-radius:3px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px;background:var(--panel2);
border-top:1px solid var(--hair2);width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;
font-family:inherit;color:inherit;cursor:pointer;transition:background 160ms var(--ease)}
.row:first-child{border-top:0}
.row .n{width:20px;flex:none}
.row .t{flex:1;font-size:14px;font-weight:500}
.row .s{margin-top:3px}
.row .go{color:var(--signal);font-size:12px}
.row.locked{opacity:.45;cursor:default}
.row.locked .go{color:var(--ink)}
.row.done .go{color:var(--muted2)}
.row:not(.locked):hover{background:#171A1D}

/* ---- word reveal ---- */
.wordrow{display:flex;align-items:baseline;gap:14px;padding:14px 0;border-bottom:1px solid var(--hair2)}
.wordrow:last-child{border-bottom:0}
.wordrow .n{flex:none;width:22px}
.wordrow .mn{font-size:27px;font-weight:500;letter-spacing:-.02em;flex:1;line-height:1.2}
.wordrow .en{font-size:13px;color:var(--ink2);text-align:right;font-weight:300}

/* ---- prompt ---- */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
color:var(--chassis);background:var(--signal);padding:3px 8px;border-radius:3px}
.tag.alt{background:transparent;color:var(--muted2);border:1px solid var(--hair)}
.prompt{font-size:46px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.prompt.sm{font-size:27px;letter-spacing:-.02em;line-height:1.3}
.prompt.en{font-size:27px;letter-spacing:-.02em;line-height:1.3}
.subnote{font-size:13px;color:var(--ink2);margin-top:10px;font-weight:300}

/* ---- controls ---- */
input.text,textarea.text{width:100%;font-family:'Geologica',system-ui,sans-serif;font-size:20px;font-weight:400;
padding:12px 13px;border:1px solid var(--hair3);border-radius:3px;background:var(--panel2);color:var(--ink);
margin-top:16px;outline:none;transition:border-color 160ms var(--ease)}
input.text:focus,textarea.text:focus{border-color:var(--signal)}
.choices{display:grid;gap:8px;margin-top:16px}
.choice{display:flex;align-items:center;gap:11px;text-align:left;font-family:'Geologica',sans-serif;
font-size:15px;font-weight:500;padding:12px 14px;border:1px solid var(--hair);border-radius:3px;
background:var(--panel2);color:var(--ink);cursor:pointer;transition:border-color 160ms var(--ease),background 160ms var(--ease)}
.choice:hover:not(:disabled){border-color:var(--hair3)}
.choice .k{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted2);
border:1px solid var(--hair);border-radius:3px;padding:2px 6px;flex:none}
.choice.right{background:var(--signal);color:var(--chassis);border-color:var(--signal)}
.choice.right .k{color:var(--chassis);border-color:rgba(0,0,0,.25)}
.choice.wrong{border-color:var(--alert);color:var(--alert)}
.choice:disabled{cursor:default}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.btn{padding:12px;text-align:center;border-radius:3px;font-family:'Geologica',sans-serif;font-size:13px;
font-weight:500;cursor:pointer;border:1px solid transparent;transition:opacity 160ms var(--ease)}
.btn.primary{background:var(--signal);color:var(--chassis)}
.btn.secondary{background:transparent;border-color:var(--hair3);color:var(--ink)}
.btn.ghost{background:transparent;border-color:var(--hair2);color:var(--muted)}
.btn:disabled{border-color:var(--hair2);color:var(--dim);background:transparent;cursor:default}
.btn:not(:disabled):active{opacity:.75}
.inline{display:flex;gap:8px}
.inline .btn{flex:1}

/* ---- feedback ---- */
.fb{margin-top:16px;border-top:1px solid var(--hair);padding-top:14px}
.fb .verdict{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.fb .verdict.ok{color:var(--signal)}
.fb .verdict.no{color:var(--alert)}
.fb .ans{font-size:20px;font-weight:500;margin-top:8px;letter-spacing:-.01em}
.fb .yours{font-size:13px;color:var(--muted);margin-top:6px;font-weight:300}
.diff span{transition:none}
.diff .hit{color:var(--ink)}
.diff .miss{color:var(--alert)}
.notechip{display:inline-block;margin-top:10px;border:1px solid var(--hair);border-radius:3px;padding:4px 8px}

/* ---- summary ---- */
.wline{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair2)}
.wline:last-child{border-bottom:0}
.wline .mn{font-size:15px;font-weight:500;min-width:120px}
.wline .en{flex:1;font-size:13px;color:var(--ink2);font-weight:300}
.dots{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;flex:none}
.bar{height:4px;background:var(--track);border-radius:2px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--signal);transition:width 180ms var(--ease)}

/* ---- tools ---- */
textarea.code{width:100%;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.6;
margin-top:12px;padding:10px;border:1px solid var(--hair);border-radius:3px;background:var(--panel2);
color:var(--muted);resize:vertical;min-height:72px;letter-spacing:0;text-transform:none}
.hintline{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.7;font-weight:300}
.foot{border-top:1px solid var(--hair);padding-top:16px;margin-top:8px;display:flex;justify-content:space-between}
@media(max-width:420px){
.prompt{font-size:36px}
.prompt.sm,.prompt.en{font-size:23px}
.wordrow .mn{font-size:23px}
}
</style>

const BYID={}; WORDS.forEach(function(w){BYID[w.id]=w;});
/* ============ HELPERS ============ */
var SAVE_KEY="mng_study_v1";
function dateKey(){return new Date().toISOString().slice(0,10);}
function todayStr(){return new Date().toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short"}).toUpperCase();}
function rng(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){return (s=s*16807%2147483647)/2147483647;};}
function shuffle(arr,r){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor((typeof r==="function"?r():Math.random())*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return (s||"").toLowerCase().replace(/[.,!?;:"'`’]/g,"").replace(/\s+/g," ").trim();}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;
for(i=0;i<=m;i++){d[i]=[i];}for(j=0;j<=n;j++){d[0][j]=j;}
for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
return d[m][n];}
function gradeText(ans,correct,strictness){
  var a=norm(ans),c=norm(correct);
  if(!a)return {ok:false,close:false};
  if(a===c)return {ok:true,close:false};
  var parts=c.split(/[\/,]/).map(norm);
  if(parts.indexOf(a)>=0)return {ok:true,close:false};
  var d=lev(a,c);
  var tol = strictness<0.34 ? 2 : strictness<0.67 ? 1 : 0;
  var lenCap = c.length<=4 ? 0 : Math.ceil(c.length*0.25);
  tol=Math.min(tol,lenCap);
  if(strictness>=0.67) tol=0;
  if(d<=tol)return {ok:true,close:d>0};
  if(d<=tol+1 && d<=Math.ceil(c.length*0.4))return {ok:false,close:true};
  return {ok:false,close:false};
}
function distractors(target,pool,n,r){
  var cand=pool.filter(function(w){return w.id!==target.id;});
  cand.sort(function(a,b){
    var sa=(a.mn[0]===target.mn[0]?-2:0)+Math.abs(a.mn.length-target.mn.length)*0.2;
    var sb=(b.mn[0]===target.mn[0]?-2:0)+Math.abs(b.mn.length-target.mn.length)*0.2;
    return sa-sb+(r()-0.5)*0.6;
  });
  return shuffle(cand.slice(0,Math.max(n*2,6)),r).slice(0,n);
}
/* ============ PROGRESS ============ */
function blankProgress(){return {learned:[],words:{},sentSkill:0.5,day:0,lastDate:null,newPerDay:3,strictness:0.2,history:[]};}
function loadProgress(){try{var raw=localStorage.getItem(SAVE_KEY);if(raw){var o=JSON.parse(raw),b=blankProgress();for(var k in o)b[k]=o[k];return b;}}catch(e){}return blankProgress();}
function saveProgress(p){try{localStorage.setItem(SAVE_KEY,JSON.stringify(p));}catch(e){}}
function encodeCode(p){try{return btoa(unescape(encodeURIComponent(JSON.stringify(p))));}catch(e){return "";}}
function decodeCode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s.trim()))));}catch(e){return null;}}
function recomputeStrictness(p){
  var r=0,w=0;for(var k in p.words){r+=p.words[k].right||0;w+=p.words[k].wrong||0;}
  var total=r+w; if(total<20)return p.strictness;
  var acc=r/total;
  return Math.max(0,Math.min(1, acc<0.6?0.1 : acc<0.75?0.35 : acc<0.88?0.6 : 0.85));
}
/* ============ SESSION BUILDER ============ */
function buildSession(p){
  var start=90+p.day*p.newPerDay, newIds=[], i;
  for(i=0;i<p.newPerDay;i++){var id=start+i;if(BYID[id])newIds.push(id);}
  var learnedSet={}; p.learned.forEach(function(x){learnedSet[x]=1;});
  var known=p.learned.map(function(id){return BYID[id];}).filter(Boolean);
  function pickKnown(count){
    if(!known.length)return [];
    var scored=known.map(function(w){
      var st=p.words[w.id]||{box:0,wrong:0,lastDay:0};
      var due=(5-(st.box||0))+(st.wrong||0)*1.2+Math.max(0,3-(p.day-(st.lastDay||0)))*0.4+Math.random()*1.5;
      return {w:w,due:due};
    }).sort(function(a,b){return b.due-a.due;});
    var poolN=Math.max(count,Math.ceil(scored.length*0.7));
    return shuffle(scored.slice(0,poolN).map(function(s){return s.w;})).slice(0,Math.min(count,known.length));
  }
  var r=rng(1000+p.day);
  var mgeWords=pickKnown(15);
  var egmWords=pickKnown(10);
  var eligible=SENTENCES.filter(function(s){return s.ids.every(function(id){return learnedSet[id]||newIds.indexOf(id)>=0;});});
  var sentPick=shuffle(eligible.length?eligible:SENTENCES,r).slice(0,3).map(function(s,i){
    var o={};for(var k in s)o[k]=s[k];o.dir=(i%2===0)?"egm":"mge";return o;});
  return {newIds:newIds,mgeWords:mgeWords,egmWords:egmWords,sentPick:sentPick};
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function pct(n){return Math.round(n*100);}
function accOf(p){
  var r=0,w=0;for(var k in p.words){r+=p.words[k].right||0;w+=p.words[k].wrong||0;}
  return (r+w)?r/(r+w):0;
}
function streakOf(p){
  var h=p.history||[];if(!h.length)return 0;
  var days=[];h.forEach(function(x){if(days.indexOf(x.date)<0)days.push(x.date);});
  days.sort();var n=0;var cur=new Date();
  for(var i=days.length-1;i>=0;i--){
    var d=new Date(days[i]+"T00:00:00");
    var diff=Math.round((cur-d)/86400000);
    if(diff<=1){n++;cur=d;}else break;
  }
  return n;
}

    var i=pool.indexOf(tok);
    if(i>=0){pool.splice(i,1);return '<span class="hit">'+esc(tok)+'</span>';}
    var near=pool.findIndex(function(x){return lev(x,tok)<=1;});
    if(near>=0){pool.splice(near,1);return '<span class="hit" style="opacity:.6">'+esc(tok)+'</span>';}
    return '<span class="miss">'+esc(tok)+'</span>';
  }).join(" ")+'</span>';
}
function viewSent(){
  var s=S.sess,item=s.sentPick[S.idx],fb=S.fb;
  var toMn=item.dir==="egm";
  var promptText=toMn?item.en:item.mn;
  var answerText=toMn?item.mn:item.en;
  var chips=item.ids.map(function(id){var w=BYID[id];return w?'<span class="notechip mono n">'+esc(w.mn)+' · '+esc(w.en)+'</span>':"";}).join(" ");
  return header()+rail()+
    '<div class="sec"><div class="qhead"><span class="tag">'+(toMn?"ENG→MGL":"MGL→ENG")+'</span>'+
    '<span class="mono">SENT '+(S.idx+1)+'/'+s.sentPick.length+'</span></div>'+
    '<div class="card">'+
    '<div class="prompt '+(toMn?"en":"sm")+'">'+esc(promptText)+'</div>'+
    (item.note?'<div class="subnote">'+esc(item.note)+'</div>':"")+
    (fb?"":'<textarea class="text" id="ansbox" rows="2" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="'+(toMn?"монголоор бич":"англиар бич")+'"></textarea>')+
    (fb?'<div class="fb"><div class="verdict '+(fb.ok?"ok":"no")+'">'+(fb.ok?"ЗӨВ":"ЗӨРҮҮ")+'</div>'+
      '<div class="ans">'+diffHtml(fb.given,answerText)+'</div>'+
      (fb.given?'<div class="yours">Таны хариу — '+esc(fb.given)+'</div>':"")+
      (chips?'<div style="margin-top:10px">'+chips+'</div>':"")+
      '</div>':"")+
    '</div>'+
    '<div class="btns">'+
    (fb?'<button class="btn primary" data-act="next">Цааш →</button>'
       :'<button class="btn primary" data-act="submit">Шалгах</button>')+
    '</div></div>';
}
function viewSummary(){
  var s=S.sess,res=s.results;
  var all=res.newcheck.concat(res.mge,res.egm,res.sent);
  var ok=all.filter(function(x){return x.ok;}).length;
  var acc=all.length?ok/all.length:0;
  var seen={},lines=[];
  all.forEach(function(x){if(x.id&&!seen[x.id]){seen[x.id]=1;lines.push(x.id);}});
  var rows=lines.map(function(id){
    var w=BYID[id];if(!w)return "";
    var st=P.words[id]||{};
    return '<div class="wline"><div class="mn">'+esc(w.mn)+'</div><div class="en">'+esc(w.en)+'</div>'+dots(st.box)+'</div>';
  }).join("");
  return header()+
    '<div class="sec"><div class="h"><span class="mono">Дүн</span><span class="mono">SESSION '+P.day+'</span></div>'+
    '<div class="card"><div class="stats">'+
      '<div><div class="mono">ЗӨВ</div><div class="v">'+pct(acc)+'%</div></div>'+
      '<div><div class="mono">АСУУЛТ</div><div class="v">'+all.length+'</div></div>'+
      '<div><div class="mono">НИЙТ ҮГ</div><div class="v">'+P.learned.length+'</div></div>'+
    '</div><div class="bar"><i style="width:'+pct(acc)+'%"></i></div></div></div>'+
    '<div class="sec"><div class="h"><span class="mono">Үгсийн байдал</span><span class="mono">SRS BOX</span></div>'+
    '<div class="card">'+rows+'</div></div>'+
    '<div class="btns"><button class="btn primary" data-act="home">Дуусгах</button></div>';
}
/* ============ CONTROLLER ============ */
function buildQuestions(){
  var s=S.sess, r=rng(2000+P.day);
  var poolAll=WORDS;
  s.checkQ=s.newIds.map(function(id){
    var w=BYID[id];
    return {w:w,opts:shuffle([w].concat(distractors(w,poolAll,3,r)),r)};
  });
  s.mgeQ=s.mgeWords.map(function(w){
    return {w:w,opts:shuffle([w].concat(distractors(w,poolAll,3,r)),r)};
  });
  s.egmQ=s.egmWords.map(function(w){
    return {w:w,opts:shuffle([w].concat(distractors(w,poolAll,3,r)),r)};
  });
}
function startDay(){
  var s=buildSession(P);
  s.results={newcheck:[],mge:[],egm:[],sent:[]};
  S.sess=s; buildQuestions();
  S.screen="session"; S.phase=0; S.idx=0; S.fb=null; S.fallback=false;
  render();
}
function finishDay(){
  var s=S.sess, np=JSON.parse(JSON.stringify(P));
  s.newIds.forEach(function(id){
    if(np.learned.indexOf(id)<0)np.learned.push(id);
    if(!np.words[id])np.words[id]={box:1,right:0,wrong:0,lastDay:np.day};
  });
  function applyRes(arr){arr.forEach(function(x){
    if(!x.id)return;
    var st=np.words[x.id]||{box:0,right:0,wrong:0};
    np.words[x.id]={box:Math.max(0,Math.min(5,(st.box||0)+(x.ok?1:-1))),
      right:(st.right||0)+(x.ok?1:0),wrong:(st.wrong||0)+(x.ok?0:1),lastDay:np.day};
  });}
  applyRes(s.results.newcheck);applyRes(s.results.mge);applyRes(s.results.egm);
  var sres=s.results.sent;
  if(sres.length){var a=sres.filter(function(x){return x.ok;}).length/sres.length;
    np.sentSkill=Math.max(0,Math.min(1,np.sentSkill*0.6+a*0.4));}
  np.day=np.day+1; np.lastDate=dateKey();
  np.strictness=recomputeStrictness(np);
  var all=s.results.newcheck.concat(s.results.mge,s.results.egm,s.results.sent);
  var acc=all.length?all.filter(function(x){return x.ok;}).length/all.length:0;
  np.history=(np.history||[]).concat([{date:dateKey(),day:np.day,acc:Math.round(acc*100),n:all.length}]);
  commit(np);
}
function curList(){
  var s=S.sess;
  return S.phase===2?s.checkQ:S.phase===3?s.mgeQ:S.phase===4?s.egmQ:S.phase===5?s.sentPick:[];
}
function bucket(){return S.phase===2?"newcheck":S.phase===3?"mge":S.phase===4?"egm":"sent";}
function advance(){
  S.fb=null; S.fallback=false;
  var list=curList();
  if(S.phase>=2&&S.idx+1<list.length){S.idx++;render();return;}
  S.idx=0;
  var next=S.phase+1;
  while(next<=5){
    S.phase=next;
    if(curList().length>0||next<2)break;
    next++;
  }
  if(next>5){finishDay();S.screen="summary";}
  render();
}
function record(id,ok){S.sess.results[bucket()].push({id:id,ok:ok});}
function onPick(id){
  if(S.fb)return;
  var list=curList(),item=list[S.idx];
  var ok=(id===item.w.id);
  S.fb={ok:ok,pickedId:id};
  record(item.w.id,ok);
  render();
}
function onSubmit(){
  var box=document.getElementById("ansbox");
  var given=box?box.value:"";
  var list=curList(),item=list[S.idx];
  if(S.phase===3){
    var g=gradeText(given,item.w.en,P.strictness);
    S.fb={ok:g.ok,close:g.close,given:given};
    record(item.w.id,g.ok);
  }else{
    var target=item.dir==="egm"?item.mn:item.en;
    var g2=gradeText(given,target,Math.max(0,P.strictness-0.15));
    S.fb={ok:g2.ok,close:g2.close,given:given};
    S.sess.results.sent.push({id:item.ids[0],ok:g2.ok});
  }
  render();
}
/* ============ RENDER + EVENTS ============ */
function render(){
  var html;
  if(S.screen==="home")html=viewHome();
  else if(S.screen==="summary")html=viewSummary();
  else{
    html=S.phase===0?viewIntro():S.phase===1?viewNewWords():S.phase===2?viewNewCheck():
         S.phase===3?viewMge():S.phase===4?viewEgm():viewSent();
  }
  app.innerHTML=html;
  window.scrollTo(0,0);
  var box=document.getElementById("ansbox");
  if(box&&!("ontouchstart" in window))box.focus();
}
document.addEventListener("click",function(e){
  var t=(e.target&&e.target.closest)?e.target.closest("[data-act]"):null;
  if(!t||t.disabled)return;
  var act=t.getAttribute("data-act");
  if(act==="start")startDay();
  else if(act==="home"){S.screen="home";S.sess=null;S.fb=null;render();}
  else if(act==="next")advance();
  else if(act==="pick")onPick(parseInt(t.getAttribute("data-id"),10));
  else if(act==="submit")onSubmit();
  else if(act==="fallback"){S.fallback=true;render();}
  else if(act==="tools"){S.tools=!S.tools;S.codeMsg="";render();}
  else if(act==="import"){
    var el=document.getElementById("incode");
    var v=decodeCode(el?el.value:"");
    if(v&&v.words&&typeof v.day==="number"){var b=blankProgress();for(var k in v)b[k]=v[k];commit(b);S.codeMsg="Амжилттай";}
    else S.codeMsg="!Код буруу байна";
    render();
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    var sub=document.querySelector('[data-act="submit"]');
    var nxt=document.querySelector('[data-act="next"]');
    if(sub&&!e.shiftKey){e.preventDefault();onSubmit();}
    else if(nxt){e.preventDefault();advance();}
  }
  if(/^[1-4]$/.test(e.key)){
    var opts=document.querySelectorAll('[data-act="pick"]');
    var i=parseInt(e.key,10)-1;
    if(opts[i]&&!opts[i].disabled)opts[i].click();
  }
});
render();

</script>
