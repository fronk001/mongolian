# Build and publish to GitHub Pages.
#
# Replaces the gh-pages branch deploy, which failed with "Timeout reached,
# aborting!": actions/deploy-pages polls for a Pages site that the branch path
# never provisioned. configure-pages below creates it explicitly, which is the
# step that was missing.
#
# Building here also means dist/ never has to be committed — CI runs the same
# build.py that runs locally, on the standard library alone.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build
        run: python build.py

      # One exception: sync loads Google's Firebase SDK, once online and after
      # the first paint (dist/sync/firebase.js). Everything else must be in
      # dist/, so the app still opens and studies with no connection at all.
      - name: Check the build is offline-first
        run: |
          if grep -rIoE "https?://[^\"'\` )]+" dist --include="*.js" --include="*.html" \
               --include="*.css" --include="*.webmanifest" \
             | grep -vE '^dist/sync/firebase\.js:https://www\.gstatic\.com/firebasejs/'; then
            echo "::error::dist/ contains an external URL; the app must work offline"
            exit 1
          fi
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/sync/firebase.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
