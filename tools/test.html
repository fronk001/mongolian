<!DOCTYPE html>
<!--
  Test runner for core/.

  This machine has no Node, so the browser is the JS runtime. Serve the repo
  root and open this page:

      py -m http.server 8000
      http://localhost:8000/tools/test.html

  It imports the real modules from ../src/core/ — not a copy — so a green run
  here is a genuine statement about the shipped code.
-->
<meta charset="utf-8">
<title>core tests</title>
<style>
  body { background:#0A0B0C; color:#EDEEEC; font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;
         margin:0; padding:24px 20px; }
  h2 { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:#5E646A;
       margin:22px 0 6px; font-weight:400; }
  h2:first-of-type { margin-top:0; }
  .r { padding:2px 0; }
  .ok::before   { content:"ok   "; color:#D8F04B; }
  .fail::before { content:"FAIL "; color:#FF6B4A; }
  .fail { color:#FF6B4A; }
  .why { color:#7C8288; padding-left:5ch; }
  #sum { margin-top:24px; padding-top:14px; border-top:1px solid rgba(255,255,255,.10);
         font-size:15px; }
  .pass { color:#D8F04B; } .bad { color:#FF6B4A; }
</style>
<div id="out"></div>
<div id="sum">running…</div>

<script type="module">
import { makeFSRS, dayKey, daysBetween } from '../src/core/fsrs.js';
import { blank, migrateV1, encodeCode, importCode, stats, exportAge, recordDay } from '../src/core/progress.js';
import { buildSession, applyGrade } from '../src/core/scheduler.js';
import { gradeText, gradeAnswer, acceptedForms } from '../src/core/grade.js';
import { buildChoices, distractors, makeRng, faceKey } from '../src/core/choices.js';
import {
  streak, bestStreak, weekCells, monthCells, weekStart, monthStart, weekday,
  periodTotals, punctuality, intakeRate, projectDate, levelFor, xpFor,
  earnedBadges, lessonWorth, stepCount, LEVELS, BADGES, xpForGrammar
} from '../src/core/goals.js';
import { gradeDrill, applyGrammarGrade, topicMastery, MASTERY_MIN_ATTEMPTS } from '../src/core/grammar.js';
import {
  toDocs, fromDocs, diff, patchesFor, applyMerge, overlay, rebase, mergeStates, same, itemsDoc, BUCKET
} from '../src/core/sync.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
const results = [];

const section = name => { out.insertAdjacentHTML('beforeend', `<h2>${name}</h2>`); };
const ok = (name, cond, why = '') => {
  cond ? pass++ : fail++;
  results.push({ name, pass: !!cond, why });
  out.insertAdjacentHTML('beforeend',
    `<div class="r ${cond ? 'ok' : 'fail'}">${name}</div>` +
    (!cond && why ? `<div class="why">${why}</div>` : ''));
};

const W = await (await fetch('../src/data/words.json')).json();
const S = await (await fetch('../src/data/sentences.json')).json();
const G = await (await fetch('../src/data/grammar.json')).json();

// ---------------------------------------------------------------- fsrs
section('fsrs');
const f = makeFSRS();
ok('R(t=S) === 0.90', Math.abs(f.retrievability(10, 10) - 0.9) < 1e-9);
ok('interval(S) === S', Math.abs(f.interval(10) - 10) < 1e-9);
const pv = f.preview({ s: 10, d: 5, reps: 3, lapses: 0 }, 10);
ok('grades produce ascending intervals', pv[0] <= pv[1] && pv[1] <= pv[2] && pv[2] <= pv[3],
   `got ${pv.map(x => x.toFixed(2)).join(', ')}`);

// dayKey must name the day where the user actually is, at every hour — not
// just whenever the suite happens to run. A UTC key rolls the day over at
// 01:00/02:00 local in the Netherlands, filing a session just after midnight
// under the previous day. Asserted at fixed local instants so the result does
// not depend on the wall clock.
const offsetH = -new Date().getTimezoneOffset() / 60;
const at = (y, mo, d, h, mi) => dayKey(new Date(y, mo - 1, d, h, mi, 0).getTime());
ok('dayKey() names the local day just after midnight', at(2026, 8, 7, 0, 30) === '2026-08-07',
   `got ${at(2026, 8, 7, 0, 30)}, want 2026-08-07 (tz UTC${offsetH >= 0 ? '+' : ''}${offsetH}` +
   `${offsetH === 0 ? '; vacuous in UTC' : ''})`);
ok('dayKey() names the local day late evening', at(2026, 8, 6, 23, 30) === '2026-08-06',
   `got ${at(2026, 8, 6, 23, 30)}, want 2026-08-06`);
ok('dayKey() names the local day at midday', at(2026, 1, 15, 12, 0) === '2026-01-15',
   `got ${at(2026, 1, 15, 12, 0)}, want 2026-01-15`);
ok('daysBetween is exact across a DST boundary',
   daysBetween('2026-03-28', '2026-03-30') === 2,
   `got ${daysBetween('2026-03-28', '2026-03-30')}`);

// ---------------------------------------------------------------- grade
section('grade');
ok('exact match', gradeText('door', 'door', 0.2).ok);
ok('slash variant accepted', gradeText('yard', 'yard/fence', 0.2).ok);
ok('short words are not typos', !gradeText('cat', 'eat', 0.2).ok);
ok('empty is wrong', !gradeText('', 'door', 0.2).ok);

// ---------------------------------------------------------------- progress
section('progress');
const v1 = { learned: [90, 91], words: { 90: { box: 5, right: 9, wrong: 0 }, 91: { box: 0, right: 0, wrong: 4 } }, day: 2, newPerDay: 3, history: [] };
const m = migrateV1(v1);
ok('v1 migrates', Object.keys(m.items).length === 2 && m.schema === 2);
ok('strong word is easier than weak word', m.items[90].d < m.items[91].d);
ok('v1 backup code still imports', importCode(encodeCode(v1))?.schema === 2);
ok('v2 code round-trips', JSON.stringify(importCode(encodeCode(m))) === JSON.stringify(m));
ok('garbage rejected', importCode('nonsense') === null);

// A pristine v1 profile (nothing learned yet) must still import.
const v1empty = { learned: [], words: {}, day: 0, newPerDay: 3, strictness: 0.2, sentSkill: 0.5, history: [] };
ok('empty v1 profile imports', importCode(encodeCode(v1empty))?.schema === 2);

// The literal byte format v1 shipped: btoa(unescape(encodeURIComponent(json))).
const v1bytes = btoa(unescape(encodeURIComponent(JSON.stringify(v1))));
ok('v1 wire format decodes byte-for-byte', importCode(v1bytes)?.schema === 2);

// ------------------------------------------------- backup age + gloss flag
// Two fields were added to the schema (lastExport, gloss). CLAUDE.md: a
// schema change must be proven not to break v1 or v2 codes.
section('backup age and gloss');
ok('blank tracks export state', blank().lastExport === null && blank().gloss === true);
ok('never exported reads null', exportAge(blank()) === null);
ok('export age counts whole days',
   exportAge({ lastExport: '2026-08-01' }, '2026-08-15') === 14,
   `got ${exportAge({ lastExport: '2026-08-01' }, '2026-08-15')}`);
ok('a future export date never goes negative',
   exportAge({ lastExport: '2026-08-20' }, '2026-08-06') === 0);

const exported = Object.assign(blank(), { lastExport: '2026-07-30', gloss: false });
const back2 = importCode(encodeCode(exported));
ok('lastExport survives a round-trip', back2.lastExport === '2026-07-30');
ok('gloss:false survives a round-trip', back2.gloss === false,
   `got ${back2.gloss} — a preference must not silently flip back on`);

// A v1 code predates both fields and must still land on sane defaults.
const v1old = { learned: [90], words: { 90: { box: 3, right: 2, wrong: 1 } }, day: 1, newPerDay: 3, history: [] };
const v1mig = importCode(btoa(unescape(encodeURIComponent(JSON.stringify(v1old)))));
ok('v1 code still imports after the schema change', v1mig?.schema === 2);
ok('v1 import defaults to never-exported', v1mig.lastExport === null);
ok('v1 import defaults gloss on', v1mig.gloss === true);

// A v2 code written before these fields existed.
const preV2 = Object.assign(blank(), { items: { 90: { s: 3, d: 5, due: '2026-08-10', last: '2026-08-06', reps: 1, lapses: 0, right: 1, wrong: 0 } } });
delete preV2.lastExport; delete preV2.gloss;
const preIn = importCode(encodeCode(preV2));
ok('older v2 code gains the new fields as defaults',
   preIn.lastExport === null && preIn.gloss === true);
ok('older v2 code keeps its items', Object.keys(preIn.items).length === 1);

// ---------------------------------------------------------------- scheduler
section('scheduler');
let p = blank();
const s1 = buildSession(p, W, S, { today: '2026-08-06' });
ok('cold start produces items', s1.items.length > 0);
// i+1 is unreachable on day 1 by definition: every content word is new, so a
// two-content-word sentence is i+2 at best. The old assertion that cold start
// was 100% i+1 only held because each sentence carried a single tag. What the
// selector must actually do is reach i+1 once there is vocabulary to lean on —
// asserted in the trajectory section below.
ok('cold start reports i+1 share honestly',
   s1.diagnostics.iPlusOneShare >= 0 && s1.diagnostics.iPlusOneShare <= 1,
   `iPlusOneShare=${s1.diagnostics.iPlusOneShare}`);
// Every word the item touches. New words now arrive as one 'deck' item
// carrying several words rather than one 'intro' item each.
const idsOf = i =>
  i.kind === 'sentence' ? i.targetIds :
  i.kind === 'deck' ? i.words.map(w => w.id) : [i.word.id];

ok('every session item resolves to real words',
   s1.items.every(i => idsOf(i).length > 0 && idsOf(i).every(id => id != null)));
ok('new words arrive as a single deck',
   s1.items.filter(i => i.kind === 'deck').length <= 1 &&
   (s1.fresh.length === 0 || s1.items[0].kind === 'deck'),
   `first item kind = ${s1.items[0]?.kind}, fresh = ${s1.fresh.length}`);
ok('the deck holds exactly the new words',
   s1.fresh.length === 0 ||
   JSON.stringify(s1.items[0].words.map(w => w.id)) === JSON.stringify(s1.fresh));
s1.items.forEach(i => idsOf(i)
  .forEach(id => applyGrade(p, id, 3, { today: '2026-08-06' })));
ok('no duplicate introductions', p.introduced.length === new Set(p.introduced).size);
const s2 = buildSession(p, W, S, { today: '2026-08-07' });
ok('day 2 introduces different words', !s2.fresh.some(id => s1.fresh.includes(id)));
ok('stats compute', stats(p).tracked > 0);

// ------------------------------------------------------------ word drills
// Vocabulary drilled on its own — the only screen multiple choice appears on.
// It used to be residue: a target became a card only when no chosen sentence
// happened to contain it, so a cold start produced none at all on days 1, 2
// and 4. buildSession() now reserves targets for drilling before the sentences
// are scored.
section('word drills');
{
  const sim = (wordDrills, days = 12) => {
    const pd = blank();
    if (wordDrills !== undefined) pd.wordDrills = wordDrills;
    let d = new Date(Date.UTC(2026, 7, 6));
    const log = [];
    for (let n = 0; n < days; n++) {
      const today = d.toISOString().slice(0, 10);
      const sess = buildSession(pd, W, S, { today });
      log.push({
        today,
        cards: sess.items.filter(i => i.kind === 'card'),
        sentences: sess.items.filter(i => i.kind === 'sentence')
      });
      // One grade per word per session — the invariant awardGrade() enforces
      // in app.js, and the reason drills are reserved rather than overlaid.
      const seen = new Set();
      sess.items.filter(i => i.kind !== 'deck').forEach(i => idsOf(i).forEach(id => {
        if (seen.has(id)) return;
        seen.add(id);
        applyGrade(pd, id, 3, { today });
      }));
      d.setUTCDate(d.getUTCDate() + 1);
    }
    return log;
  };

  const on = sim(undefined);
  ok('every day carries at least one word card',
     on.every(r => r.cards.length > 0),
     `empty days: ${on.filter(r => !r.cards.length).map(r => r.today).join(', ') || 'none'}`);
  ok('day one carries word cards', on[0].cards.length > 0,
     `day 1 cards = ${on[0].cards.length}`);
  ok('the sentence phase survives the reservation',
     on.every(r => r.sentences.length > 0),
     `sentence-less days: ${on.filter(r => !r.sentences.length).length}`);

  // The property that keeps FSRS honest: presented once, so graded once. A
  // second same-day grade would apply the short-term term again (~1.29×
  // stability) and count one memory as two reviews.
  ok('no word is both drilled and taught by a sentence in one session',
     on.every(r => {
       const carded = new Set(r.cards.map(c => c.word.id));
       return !r.sentences.some(s => s.targetIds.some(id => carded.has(id)));
     }));

  ok('drilling more leaves fewer sentences',
     sim(14).reduce((a, r) => a + r.cards.length, 0) >
     sim(4).reduce((a, r) => a + r.cards.length, 0));

  // Off is a real setting, not a no-op: it restores the old behaviour, where a
  // card appears only for a target no sentence could carry.
  const off = sim(0);
  ok('wordDrills:0 falls back to sentence-residue cards',
     off.reduce((a, r) => a + r.cards.length, 0) <
     on.reduce((a, r) => a + r.cards.length, 0));

  // Direction is decided by the scheduler, seeded on the word and the date —
  // it used to be the card's index in the session, so a word could be asked
  // the same way round for a week.
  ok('every word card carries a direction',
     on.every(r => r.cards.every(c => c.dir === 'mge' || c.dir === 'egm')));
  ok('a word met today is asked Mongolian-first',
     on.every(r => r.cards.every(c => !c.isNew || c.dir === 'mge')));
  ok('direction is stable across rebuilds of the same session',
     JSON.stringify(buildSession(blank(), W, S, { today: '2026-08-06' })
       .items.filter(i => i.kind === 'card').map(i => [i.word.id, i.dir])) ===
     JSON.stringify(buildSession(blank(), W, S, { today: '2026-08-06' })
       .items.filter(i => i.kind === 'card').map(i => [i.word.id, i.dir])));

  // ENG→MGL is production and it is the harder half. Only review cards ask it,
  // so taking all the new words first starved it to 14% of all cards.
  const reviewCards = on.flatMap(r => r.cards).filter(c => !c.isNew);
  ok('review cards ask both directions',
     reviewCards.some(c => c.dir === 'egm') && reviewCards.some(c => c.dir === 'mge'),
     `${reviewCards.filter(c => c.dir === 'egm').length} egm of ${reviewCards.length} review cards`);
}

// ---------------------------------------------------------------- orphans
// An id in p.items whose word has left words.json must not be counted as due
// anywhere, or the home screen shows work that cannot be started.
section('orphaned ids');
let po = blank();
applyGrade(po, 90, 1, { today: '2026-08-01' });   // real word, comes due fast
applyGrade(po, 99999, 1, { today: '2026-08-01' }); // word no longer in words.json
const so = buildSession(po, W, S, { today: '2026-08-20' });
ok('orphan is not offered in the session',
   !so.items.some(i => i.kind === 'card' && !i.word));
ok('orphan is not counted in diagnostics.dueCount',
   so.diagnostics.dueCount === so.due.length && !so.due.includes(99999),
   `due=${JSON.stringify(so.due)} dueCount=${so.diagnostics.dueCount}`);
ok('stats.due agrees with diagnostics.dueCount',
   stats(po, { words: W }).due === so.diagnostics.dueCount,
   `stats.due=${stats(po, { words: W }).due} diag.dueCount=${so.diagnostics.dueCount}`);
ok('a session is never empty while the home screen reports work',
   so.diagnostics.dueCount + so.diagnostics.newCount === 0 || so.items.length > 0);

// ------------------------------------------------- reference-only grammar
// drill:false words are scaffolding: never taught as cards, but they count as
// known context and can never be the i+1 element.
section('reference words (drill:false)');
const refIds = new Set(W.filter(w => w.drill === false).map(w => w.id));
ok('lexicon has reference words', refIds.size > 0, `found ${refIds.size}`);
ok('every word still has id, mn, en',
   W.every(w => typeof w.id === 'number' && w.mn && w.en));

let pr = blank();
const sr = buildSession(pr, W, S, { today: '2026-08-06', newCount: 6 });
ok('no reference word is ever introduced as new',
   !sr.fresh.some(id => refIds.has(id)),
   `fresh=${JSON.stringify(sr.fresh)}`);
ok('no reference word is offered as a card or in the deck',
   !sr.items.some(i => i.kind !== 'sentence' && idsOf(i).some(id => refIds.has(id))));
ok('no reference word is a grade target',
   !sr.items.some(i => i.kind === 'sentence' && i.targetIds.some(id => refIds.has(id))));

// i+N must count only drillable elements. Before drill:false was handled,
// every grammar word counted as "new" and so as weak, making i+N meaningless.
const sents = sr.items.filter(i => i.kind === 'sentence');
ok('i+N counts only drillable words',
   sents.every(i => i.weak <= i.sentence.ids.filter(id => !refIds.has(id)).length),
   sents.map(i => `i+${i.weak}/${i.sentence.ids.length}`).join(' '));
ok('a sentence made only of grammar plus one new word is i+1',
   sents.every(i => i.weak >= 1));

// Comprehensibility must be a real fraction now, not 0% or 100%.
const comps = new Set(sents.map(i => Math.round(i.comprehensible * 100)));
ok('comprehensibility takes intermediate values',
   [...comps].some(c => c > 0 && c < 100),
   `values seen: ${[...comps].sort((a, b) => a - b).join('%, ')}%`);

// ---------------------------------------------------------------- corpus
section('corpus integrity');
const ids = new Set(W.map(w => w.id));
ok('every sentence tag resolves to a word', S.every(s => s.ids.every(i => ids.has(i))));
ok('no duplicate word ids', ids.size === W.length);
ok('no duplicate mn forms', new Set(W.map(w => w.mn)).size === W.length);
ok('sentences carry more than one tag on average',
   S.reduce((a, s) => a + s.ids.length, 0) / S.length > 2,
   `${(S.reduce((a, s) => a + s.ids.length, 0) / S.length).toFixed(2)} tags/sentence`);
ok('sentences with unknown vocabulary are marked partial',
   S.filter(s => s.partial).length < S.length * 0.05,
   `${S.filter(s => s.partial).length} partial of ${S.length}`);

// ------------------------------------------------------------ trajectory
// The selector's real job: once vocabulary exists, find sentences where
// exactly one element is weak. Replay a month of perfect reviews and check
// the curve rather than any single day.
section('trajectory (45 simulated days)');
{
  let p = blank();
  const d = new Date(Date.UTC(2026, 7, 6));
  const log = [];
  for (let day = 0; day < 45; day++) {
    const today = d.toISOString().slice(0, 10);
    const s = buildSession(p, W, S, { today });
    log.push({ day: day + 1, ...s.diagnostics, items: stepCount(s) });
    s.items.forEach(i => idsOf(i).forEach(id => applyGrade(p, id, 3, { today })));
    d.setUTCDate(d.getUTCDate() + 1);
  }
  const early = log.slice(3, 25);
  ok('i+1 becomes reachable once vocabulary exists',
     Math.max(...early.map(l => l.iPlusOneShare)) >= 0.75,
     `peak i+1 share over days 4-25 = ${Math.max(...early.map(l => l.iPlusOneShare)).toFixed(2)}`);
  ok('comprehensibility rises as words are learned',
     log[24].avgComprehensibility > log[1].avgComprehensibility,
     `day 2 ${log[1].avgComprehensibility.toFixed(2)} -> day 25 ${log[24].avgComprehensibility.toFixed(2)}`);
  ok('no simulated day reports work it cannot present',
     log.every(l => l.dueCount + l.newCount === 0 || l.items > 0));
  ok('a session never exceeds a sane length', Math.max(...log.map(l => l.items)) <= 40,
     `longest session = ${Math.max(...log.map(l => l.items))} items`);

  // Documents the content ceiling the roadmap calls the binding constraint.
  const dry = log.findIndex(l => l.newCount === 0);
  ok('content runway is recorded, not guessed', dry > 0,
     `new material runs out on simulated day ${dry + 1}; ` +
     `from there the app is review-only`);
}

// ------------------------------------------------- accepted answers + typos
// Once the app is live there is nobody to appeal to: an answer that is right
// has to be accepted, and a misspelt right answer has to be told apart from
// a wrong one.
section('accepted answers');
{
  ok('a slash lists variants', acceptedForms('yard/fence').join('|') === 'yard|fence');
  // Splitting on commas as well would tear this into two acceptable halves.
  ok('a comma is not a separator', acceptedForms('No, thank you').length === 1);
  ok('blank fields yield nothing', acceptedForms('').length === 0 && acceptedForms(null).length === 0);

  const alts = ['The floor is clean.', "The floor's clean.", 'The floor is tidy.'];
  ok('canonical answer is accepted', gradeAnswer('The floor is clean.', alts).ok);
  ok('a listed alternative is accepted', gradeAnswer("the floor's clean", alts).ok);
  ok('a second alternative is accepted', gradeAnswer('The floor is tidy', alts).ok);
  ok('an unlisted answer is rejected', gradeAnswer('The wall is clean', alts).ok === false);
  ok('the matched form is reported',
     gradeAnswer('The floor is tidy', alts).matched === 'The floor is tidy.');

  // The whole point of the feature: right word, wrong spelling.
  const t = gradeAnswer('The floor is clen.', alts);
  ok('a misspelt right answer is accepted', t.ok === true);
  ok('...and is flagged as a typo', t.typo === true);
  ok('...and carries the correct spelling', t.matched === 'The floor is clean.');
  ok('a clean answer is not flagged as a typo',
     gradeAnswer('The floor is clean.', alts).typo === false);
  ok('a wrong answer is not a typo',
     gradeAnswer('completely different', alts).typo === false);

  // A near-miss on one form must not beat an exact match on another.
  ok('exact match wins over a near miss on another form',
     gradeAnswer('The floor is tidy.', alts).typo === false);

  // Short words get no tolerance: дэр and дээр are different words.
  ok('short words tolerate no typo', gradeAnswer('дээр', ['дэр']).ok === false);
  ok('long words tolerate one slip', gradeAnswer('хаалагыг', ['хаалгыг']).ok === true);
  ok('strictness 1 tolerates nothing', gradeAnswer('The floor is clen.', alts, 1).ok === false);

  ok('an empty answer is never correct', gradeAnswer('', alts).ok === false);
  ok('gradeText still works for one target', gradeText('yard', 'yard/fence').ok === true);
}

// ------------------------------------------------------- corpus alternatives
// The generated answer sets have to be well-formed, or the app silently
// accepts something wrong — worse than rejecting something right.
section('corpus alternatives');
{
  const withAlt = S.filter(s => s.alt);
  ok('most sentences carry alternatives', withAlt.length >= 150,
     `${withAlt.length}/${S.length}`);
  // `altReviewed` tracks the Mongolian only — that is the part needing a
  // native speaker. A sentence carrying nothing but English alternatives is
  // never on Luna's sheet, so it must not sit "pending" for ever.
  const withMn = S.filter(s => (s.alt || {}).mn);
  ok('every mongolian set carries an explicit review flag',
     withMn.every(s => typeof s.altReviewed === 'boolean'),
     `${withMn.filter(s => typeof s.altReviewed !== 'boolean').length} missing`);
  ok('english-only sets carry no review flag',
     withAlt.filter(s => !(s.alt || {}).mn).every(s => s.altReviewed === undefined));
  const pending = withMn.filter(s => s.altReviewed === false);
  ok('no mongolian is still awaiting review', pending.length === 0,
     `${pending.length} pending: ${pending.slice(0, 3).map(s => s.mn).join(' | ')}`);
  ok('alternatives are arrays of non-empty strings',
     withAlt.every(s => ['en', 'mn'].every(k =>
       !s.alt[k] || (Array.isArray(s.alt[k]) && s.alt[k].every(v => typeof v === 'string' && v.trim())))));

  // A canonical answer repeated as its own alternative is dead weight and
  // would show "accepted alternative" for the expected answer.
  const dupes = withAlt.filter(s =>
    (s.alt.en || []).some(v => v.toLowerCase() === s.en.toLowerCase()) ||
    (s.alt.mn || []).some(v => v.toLowerCase() === s.mn.toLowerCase()));
  ok('no alternative repeats its canonical form', dupes.length === 0,
     dupes.slice(0, 3).map(s => s.mn).join(' | '));

  const selfDupe = withAlt.filter(s => ['en', 'mn'].some(k => {
    const a = (s.alt[k] || []).map(v => v.toLowerCase());
    return new Set(a).size !== a.length;
  }));
  ok('no alternative is listed twice', selfDupe.length === 0,
     selfDupe.slice(0, 3).map(s => s.mn).join(' | '));

  // Mongolian alternatives must actually be Mongolian, and English English.
  const cyr = /[Ѐ-ӿ]/;
  ok('mongolian alternatives are Cyrillic',
     withAlt.every(s => (s.alt.mn || []).every(v => cyr.test(v))));
  ok('english alternatives are not Cyrillic',
     withAlt.every(s => (s.alt.en || []).every(v => !cyr.test(v))));

  // Two bugs the first generation run actually produced, tested directly
  // rather than by guessing at a pattern.

  // Contraction chaining: "There isn't any salt" -> "There is not any salt"
  // -> "there'sn't any salt".
  // "there'sn't" carries the apostrophe before the -n; a plain "isn't" does not.
  const chained = withAlt.flatMap(s => (s.alt.en || []).filter(v => /'sn/.test(v)));
  ok('contractions were never chained', chained.length === 0, chained.slice(0, 3).join(' | '));

  // Grammar-word swapping: `байна` glosses as "is / are", and substituting
  // one for the other gave "The floor are clean".
  const agree = withAlt.flatMap(s => (s.alt.en || []).filter(v =>
    v.toLowerCase().replace(/\bare\b/g, 'is') === s.en.toLowerCase().replace(/\bare\b/g, 'is') &&
    v.toLowerCase() !== s.en.toLowerCase()));
  ok('no alternative differs from canonical only by is/are',
     agree.length === 0, agree.slice(0, 3).join(' | '));

  // Every accepted form must actually grade as correct against its own set.
  let bad = [];
  for (const s of S) {
    for (const [field, key] of [['en', 'en'], ['mn', 'mn']]) {
      const set = [s[field], ...((s.alt && s.alt[key]) || [])];
      for (const form of set) {
        if (!gradeAnswer(form, set).ok) bad.push(`${s.mn} :: ${form}`);
      }
    }
  }
  ok('every listed form grades as correct against its own set', bad.length === 0,
     bad.slice(0, 3).join(' | '));

  // And no sentence's answer set accidentally accepts a different sentence.
  const collisions = [];
  for (let i = 0; i < S.length; i++) {
    const set = [S[i].en, ...((S[i].alt && S[i].alt.en) || [])];
    for (let j = 0; j < S.length; j++) {
      if (i === j) continue;
      if (gradeAnswer(S[j].en, set).ok) collisions.push(`${S[i].en} <= ${S[j].en}`);
    }
  }
  ok('one sentence never accepts another sentence as its answer',
     collisions.length === 0, collisions.slice(0, 4).join(' | '));
}

// ---------------------------------------------------------------- choices
// A multiple-choice question with two right answers grades as a failure the
// learner did not commit, so the dedup rule is the one that actually matters.
section('multiple choice');
const BY = Object.fromEntries(W.map(w => [w.id, w]));
{
  const target = W.find(w => w.drill !== false);
  const c = buildChoices(target, W, { dir: 'mge', count: 4 });
  ok('builds a full set of options', c.usable && c.options.length === 4,
     `got ${c.options.length}`);
  ok('exactly one option is correct',
     c.options.filter(o => o.correct).length === 1);
  ok('the correct option is the target',
     c.options[c.answerIndex].id === target.id);
  ok('no two options read the same',
     new Set(c.options.map(o => faceKey(o.text))).size === c.options.length,
     JSON.stringify(c.options.map(o => o.text)));

  // The view re-renders on every state change; unseeded options jumped
  // position between answering and seeing the feedback.
  const again = buildChoices(target, W, { dir: 'mge', count: 4 });
  ok('options are stable across renders',
     JSON.stringify(c.options) === JSON.stringify(again.options));
  ok('a different word gets a different question',
     JSON.stringify(buildChoices(W[5], W, { dir: 'mge' }).options.map(o => o.id))
     !== JSON.stringify(c.options.map(o => o.id)));

  const cm = buildChoices(target, W, { dir: 'egm', count: 4 });
  ok('egm shows Mongolian options', cm.options.every(o => /[Ѐ-ӿ]/.test(o.text)));
  ok('mge shows English options', c.options.every(o => !/[Ѐ-ӿ]/.test(o.text)));

  // Whole-lexicon sweep: every drillable word must produce a clean question.
  const bad = W.filter(w => w.drill !== false).map(w => {
    const q = buildChoices(w, W, { dir: 'mge', count: 4 });
    const dupes = new Set(q.options.map(o => faceKey(o.text))).size !== q.options.length;
    return (!q.usable || dupes || q.options.filter(o => o.correct).length !== 1) ? w.mn : null;
  }).filter(Boolean);
  ok('every drillable word yields a valid question', bad.length === 0,
     `${bad.length} failed: ${bad.slice(0, 5).join(', ')}`);

  // A pool too small to fill the question must say so rather than show one option.
  const tiny = buildChoices(W[0], [W[0]], { dir: 'mge', count: 4 });
  ok('an unusable pool is reported, not rendered', tiny.usable === false);

  const r = makeRng(42);
  ok('rng is deterministic and in range',
     makeRng(42)() === r() && r() >= 0 && r() < 1);
}

// Grammar topics (src/data/grammar.json) are a separate, on-demand practice

section('grammar');
{
  ok('grammar.json has topics', G.length > 0, `${G.length} topics`);
  ok('every topic has the required fields',
     G.every(t => t.id && t.level && t.title && t.summary && t.sourceCite &&
       Array.isArray(t.examples) && t.examples.length > 0 &&
       Array.isArray(t.drills) && t.drills.length > 0));
  ok('every topic id is unique', new Set(G.map(t => t.id)).size === G.length);
  ok('every example has mn and en', G.every(t => t.examples.every(e => e.mn && e.en)));
  ok('every topic is pending review, like a fresh lexicon entry',
     G.every(t => t.reviewed === false),
     'machine-written grammar content should not ship as confirmed — see CLAUDE.md');

  const allDrills = G.flatMap(t => t.drills);
  ok('every drill is a known kind',
     allDrills.every(d => ['choice', 'transform', 'build'].includes(d.kind)),
     allDrills.filter(d => !['choice', 'transform', 'build'].includes(d.kind)).map(d => d.kind).join(', '));

  const choiceDrills = allDrills.filter(d => d.kind === 'choice');
  ok('every choice drill\'s answer is one of its options',
     choiceDrills.every(d => d.options.includes(d.answer)),
     choiceDrills.filter(d => !d.options.includes(d.answer)).map(d => d.id).join(', '));
  ok('no choice drill repeats an option',
     choiceDrills.every(d => new Set(d.options).size === d.options.length),
     choiceDrills.filter(d => new Set(d.options).size !== d.options.length).map(d => d.id).join(', '));
  ok('picking the right option grades correct',
     choiceDrills.every(d => gradeDrill(d, d.answer).ok));
  ok('picking a wrong option grades incorrect',
     choiceDrills.every(d => d.options.filter(o => o !== d.answer)
       .every(wrong => !gradeDrill(d, wrong).ok)));

  const transformDrills = allDrills.filter(d => d.kind === 'transform');
  ok('a transform drill\'s own answer grades correct',
     transformDrills.every(d => gradeDrill(d, d.to).ok));
  ok('a transform drill rejects the untransformed sentence',
     transformDrills.every(d => d.from === d.to || !gradeDrill(d, d.from).ok));

  const buildDrills = allDrills.filter(d => d.kind === 'build');
  ok('a build drill\'s own word order grades correct',
     buildDrills.every(d => gradeDrill(d, d.words).ok));
  ok('a build drill in the wrong order grades incorrect',
     buildDrills.every(d => {
       if (d.words.length < 2) return true;
       const swapped = [...d.words];
       [swapped[0], swapped[1]] = [swapped[1], swapped[0]];
       return !gradeDrill(d, swapped).ok;
     }));
  ok('every build drill\'s words join into its own mn field',
     buildDrills.every(d => d.words.join(' ') === d.mn),
     buildDrills.filter(d => d.words.join(' ') !== d.mn).map(d => d.id).join(', '));

  // Mastery: a running right/wrong count per topic, withheld until there is
  // enough of a sample — never an early 100% or 0% off one lucky guess.
  let pg = blank();
  const topicId = G[0].id;
  ok('an untouched topic has no mastery reading yet',
     topicMastery(pg.grammar[topicId]) === null);
  for (let i = 0; i < MASTERY_MIN_ATTEMPTS - 1; i++) applyGrammarGrade(pg, topicId, true);
  ok('mastery stays withheld just under the attempt threshold',
     topicMastery(pg.grammar[topicId]) === null,
     `${MASTERY_MIN_ATTEMPTS - 1} attempts`);
  applyGrammarGrade(pg, topicId, false);
  const m = topicMastery(pg.grammar[topicId]);
  ok('mastery appears once the threshold is reached',
     m !== null && m >= 0 && m <= 1, `got ${m}`);
  ok('mastery reflects the right/wrong split',
     Math.abs(m - (MASTERY_MIN_ATTEMPTS - 1) / MASTERY_MIN_ATTEMPTS) < 1e-9, `got ${m}`);
  ok('right and wrong are tracked independently',
     pg.grammar[topicId].right === MASTERY_MIN_ATTEMPTS - 1 && pg.grammar[topicId].wrong === 1);

  // XP: flatter than xpFor() since there is no stability curve here, but
  // still nothing without an actual graded attempt.
  ok('a correct drill earns more xp than an incorrect one',
     xpForGrammar(true) > xpForGrammar(false));
  ok('even a wrong attempt earns the base — showing up is not nothing',
     xpForGrammar(false) > 0);

  // Additive-only, like every other field in blank(): a code written before
  // this feature existed must still import, and gain grammar:{} as a default.
  ok('blank state carries an empty grammar map', JSON.stringify(blank().grammar) === '{}');
  const richG = Object.assign(blank(), { grammar: { [topicId]: { right: 3, wrong: 1, last: '2026-08-10' } } });
  const backG = importCode(encodeCode(richG));
  ok('grammar progress survives a round-trip',
     JSON.stringify(backG.grammar) === JSON.stringify(richG.grammar));
  const preGrammar = blank();
  delete preGrammar.grammar;
  const inG = importCode(encodeCode(preGrammar));
  ok('a code written before grammar topics existed still imports and defaults to {}',
     inG !== null && JSON.stringify(inG.grammar) === '{}');
}

// ---------------------------------------------------------------- sync
// How progress is laid out online, what a change sends, and how two copies
// are combined. The engine driving this, with two pretend devices, is tested
// in tools/engine-test.html.
{
  const clone = x => JSON.parse(JSON.stringify(x));
  const addDay = (key, n) => new Date(Date.parse(key + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);

  // A real record: two weeks of lessons through the real scheduler, graded
  // once per word per session like awardGrade(), plus the fields the app
  // sets around them.
  function study(p, from, days) {
    for (let n = 0; n < days; n++) {
      const today = addDay(from, n);
      const sess = buildSession(p, W, S, { today });
      const seen = new Set();
      let xp = 0;
      sess.items.filter(i => i.kind !== 'deck').forEach(i => idsOf(i).forEach(id => {
        if (seen.has(id)) return;
        seen.add(id);
        const prev = p.items[id];
        const next = applyGrade(p, id, 3, { today });
        xp += xpFor(prev?.s, next.s);
      }));
      p.xp += xp;
      recordDay(p, { date: today, tracked: Object.keys(p.items).length, due: 0, known: 0,
        reviews: seen.size, newWords: 0, onTime: seen.size, late: 0, xp });
      p.lastDate = today;
    }
    return p;
  }
  const grade = (p, id, g, today) => {
    const prev = p.items[id];
    const next = applyGrade(p, id, g, { today });
    p.xp += xpFor(prev?.s, next.s);
    return p;
  };

  const rec = study(blank(), '2026-09-20', 14);
  rec.history.unshift({ date: '2025-12-30', tracked: 3, due: 1, known: 0, reviews: 4, newWords: 3, onTime: 4, late: 0, xp: 30 });
  rec.purpose = 'Сарнайн гэр бүлтэй ярих';
  rec.mcMode = false;
  rec.wordDrills = 0;
  rec.badges = ['first', 'week7'];
  applyGrammarGrade(rec, G[0].id, true, '2026-10-01');
  applyGrammarGrade(rec, G[0].id, false, '2026-10-02');
  const docs = toDocs(rec);
  const words = Object.keys(rec.items);

  section('sync: layout online');
  ok('a real record to test with', words.length > 20 && rec.history.length === 15,
     `${words.length} words, ${rec.history.length} days`);
  ok('each word is filed in its hundred-word document',
     words.every(id => docs[itemsDoc(id)].items[id] && Math.floor(id / BUCKET) === Number(itemsDoc(id).slice(6))));
  ok('word ids 90, 150 and 273 land in items-0, items-1 and items-2',
     itemsDoc(90) === 'items-0' && itemsDoc('150') === 'items-1' && itemsDoc(273) === 'items-2');
  ok('main carries no words, history or introductions',
     !('items' in docs.main) && !('history' in docs.main) && !('introduced' in docs.main));
  ok('history is filed per year, keyed by day',
     docs['2025'].history['2025-12-30'].reviews === 4 && Object.keys(docs['2026'].history).length === 14);
  ok('badges and introduced words become sets',
     docs.main.badges.week7 === true &&
     rec.introduced.every(id => docs[itemsDoc(id)].introduced[String(id)] === true));

  const back = fromDocs(docs);
  ok('the record round-trips', same(toDocs(back), docs));
  ok('every word\'s FSRS state comes back exactly', same(back.items, rec.items));
  ok('introduced words come back as numbers',
     back.introduced.length === rec.introduced.length && back.introduced.every(id => typeof id === 'number'));
  ok('history comes back in date order, all of it',
     back.history.length === 15 && back.history.every((h, i) => !i || back.history[i - 1].date < h.date));
  ok('settings survive, Cyrillic and falsy values included',
     back.purpose === rec.purpose && back.mcMode === false && back.wordDrills === 0 && back.xp === rec.xp);
  ok('sync bookkeeping (main.seq) never reaches the progress',
     !('seq' in fromDocs({ ...docs, main: { ...docs.main, seq: { phone: 4 } } })));
  const bare = fromDocs({ main: { schema: 2, xp: 5 } });
  ok('a sparse online copy still gives a complete record',
     bare.xp === 5 && same(bare.items, {}) && bare.history.length === 0 && same(bare.grammar, {}) && bare.mcMode === true);
  ok('a record migrated from a v1 code round-trips',
     same(toDocs(fromDocs(toDocs(migrateV1(v1)))), toDocs(migrateV1(v1))));

  const twice = toDocs(Object.assign(blank(), { history: [
    { date: '2026-09-01', reviews: 2, known: 5, xp: 20 }, { date: '2026-09-01', reviews: 3, known: 7, xp: 30 }] }));
  const folded = twice['2026'].history['2026-09-01'];
  ok('two rows for one day fold the way recordDay() folds them',
     folded.reviews === 5 && folded.xp === 50 && folded.known === 7, JSON.stringify(folded));
  const undated = toDocs(Object.assign(blank(), { history: [{ tracked: 3, due: 1 }] }));
  ok('a row without a date is kept, not dropped',
     fromDocs(undated).history.length === 1 && fromDocs(undated).history[0].tracked === 3);

  // Firestore: 1 MiB and 40,000 index entries per document; every leaf is
  // two entries (ascending and descending).
  const leaves = o => Object.values(o).reduce((n, v) =>
    n + (v && typeof v === 'object' && !Array.isArray(v) ? leaves(v) : 1), 0);
  const all = W.filter(w => w.drill !== false).map(w => w.id);
  const full = Object.assign(blank(), { items: {}, introduced: all });
  all.forEach(id => { full.items[id] = { s: 30.5, d: 5.2, due: '2026-10-01', last: '2026-09-01', reps: 9, lapses: 1, right: 8, wrong: 1 }; });
  const biggest = Math.max(...Object.entries(toDocs(full)).filter(([id]) => id.startsWith('items-')).map(([, d]) => leaves(d) * 2));
  ok('every word document stays far below Firestore\'s limits', biggest < 4000,
     `largest: ${biggest} index entries with every drillable word learned`);

  section('sync: what a change sends');
  const DEL = Symbol('delete');
  const land = (a, b) => {
    const out = toDocs(a);
    for (const w of patchesFor(diff(toDocs(a), toDocs(b)), DEL)) out[w.id] = applyMerge(out[w.id] || {}, w.data, DEL);
    return out;
  };
  const known = words[0];
  const g1 = grade(clone(rec), Number(known), 3, '2026-10-04');
  const ops1 = diff(docs, toDocs(g1));
  ok('grading a word sends that word whole, plus the xp',
     ops1.length === 2 && same(ops1.map(o => o.path.join('.')).sort(), [`${itemsDoc(known)}.items.${known}`, 'main.xp'].sort()),
     JSON.stringify(ops1.map(o => o.path.join('.'))));
  ok('each change carries what was there before',
     same(ops1.find(o => o.path[1] === 'items').from, rec.items[known]) && ops1.find(o => o.path[1] === 'xp').from === rec.xp);
  const fresh = W.find(w => w.drill !== false && !rec.items[w.id]).id;
  const ops2 = diff(docs, toDocs(grade(clone(rec), fresh, 3, '2026-10-04')));
  ok('a new word is introduced as well', ops2.some(o => o.path.join('.') === `${itemsDoc(fresh)}.introduced.${fresh}`));

  const g2 = clone(g1);
  recordDay(g2, { date: '2026-10-04', tracked: 30, due: 2, known: 1, reviews: 1, newWords: 0, onTime: 1, late: 0, xp: 9 });
  applyGrammarGrade(g2, G[1].id, true, '2026-10-04');
  g2.mcMode = true;
  g2.badges.push('perfect');
  ok('a day, a grammar drill, a setting and a badge land exactly', same(land(g1, g2), toDocs(g2)));
  const newRow = diff(toDocs(g1), toDocs(g2)).filter(o => o.path[0] === '2026');
  ok('a new day travels field by field, so two devices\' counts can add up',
     newRow.length > 3 && newRow.every(o => o.path.length === 4));
  const older = migrateV1(v1);
  ok('importing an older code removes what is gone, online too', same(toDocs(fromDocs(land(g2, older))), toDocs(older)));
  ok('removing a whole year never leaves an empty day behind',
     Object.keys(land(g2, older)['2026'] || {}).length === 0 && !diff(toDocs(g2), toDocs(older)).some(o => o.path.length === 1));
  ok('nothing changed, nothing sent', diff(docs, toDocs(clone(rec))).length === 0);

  section('sync: two copies combined (first sign-in)');
  // The same record, then studied apart: the laptop on the 4th, the phone
  // on the 5th, a word on both.
  const shared = words[1];
  const laptop = grade(clone(rec), Number(shared), 3, '2026-10-04');
  const onlyL = W.find(w => w.drill !== false && !rec.items[w.id]).id;
  grade(laptop, onlyL, 3, '2026-10-04');
  recordDay(laptop, { date: '2026-10-04', tracked: 40, reviews: 2, xp: 18 });
  laptop.lastDate = '2026-10-04';
  laptop.purpose = 'Сарнай';
  const phone = grade(clone(rec), Number(shared), 1, '2026-10-05');
  const onlyP = W.find(w => w.drill !== false && !rec.items[w.id] && w.id !== onlyL).id;
  grade(phone, onlyP, 3, '2026-10-05');
  recordDay(phone, { date: '2026-10-05', tracked: 41, reviews: 2, xp: 12 });
  phone.lastDate = '2026-10-05';
  phone.purpose = '';
  phone.mcMode = true;
  phone.badges.push('perfect');
  applyGrammarGrade(phone, G[0].id, true, '2026-10-05');

  const m = mergeStates(phone, laptop);
  ok('words studied on either device are all there',
     m.items[onlyL] && m.items[onlyP] && m.introduced.includes(onlyL) && m.introduced.includes(onlyP));
  ok('a word studied on both keeps the more recent review', same(m.items[shared], phone.items[shared]));
  ok('every day from both is kept', m.history.some(h => h.date === '2026-10-04') &&
     m.history.some(h => h.date === '2026-10-05') && m.history.length === 17, `${m.history.length} days`);
  ok('xp is the higher figure, never a double count of the shared part',
     m.xp === Math.max(laptop.xp, phone.xp));
  ok('badges from either', m.badges.includes('perfect') && m.badges.includes('week7'));
  ok('grammar keeps the count with more attempts', same(m.grammar[G[0].id], phone.grammar[G[0].id]));
  ok('settings come from the copy studied most recently', m.mcMode === true && m.lastDate === '2026-10-05');
  ok('a reason written on either survives', m.purpose === 'Сарнай');
  ok('it does not matter which device signs in first', same(toDocs(m), toDocs(mergeStates(laptop, phone))));
  ok('a fresh device takes the online copy as it is', same(toDocs(mergeStates(blank(), rec)), docs));
  ok('combining a copy with itself changes nothing', same(toDocs(mergeStates(rec, clone(rec))), docs));
  const dayA = Object.assign(blank(), { history: [{ date: '2026-10-06', reviews: 9, xp: 80, known: 4 }] });
  const dayB = Object.assign(blank(), { history: [{ date: '2026-10-06', reviews: 4, xp: 90, known: 6 }] });
  ok('a day on both keeps the fuller row whole, never a figure from each',
     same(mergeStates(dayB, dayA).history[0], dayA.history[0]) && same(mergeStates(dayA, dayB).history[0], dayA.history[0]));

  section('sync: offline changes re-applied (rebase)');
  // The phone went offline at `rec` and made `ops`; meanwhile the laptop's
  // lesson reached the database.
  const offline = diff(docs, toDocs(phone));
  ok('nothing changed online: every change goes up exactly as made', same(rebase(offline, docs), offline));
  const online = toDocs(laptop);
  const up = overlay(online, rebase(offline, online));
  const upXp = up.main.xp;
  ok('xp: both lessons count', upXp === rec.xp + (laptop.xp - rec.xp) + (phone.xp - rec.xp),
     `got ${upXp}, want ${rec.xp} + ${laptop.xp - rec.xp} + ${phone.xp - rec.xp}`);
  ok('a word studied on both keeps the more recent review',
     same(get(up, [itemsDoc(shared), 'items', shared]), phone.items[shared]));
  const late = diff(toDocs(rec), toDocs(grade(clone(rec), Number(shared), 3, '2026-10-03')));
  ok('...and an older offline review gives way to a newer one online',
     same(get(overlay(online, rebase(late, online)), [itemsDoc(shared), 'items', shared]), laptop.items[shared]));
  ok('words from both are there', get(up, [itemsDoc(onlyL), 'items', String(onlyL)]) && get(up, [itemsDoc(onlyP), 'items', String(onlyP)]));
  ok('last studied keeps the later day', up.main.lastDate === '2026-10-05');
  ok('a setting changed offline is the latest word', up.main.mcMode === true);

  // Both finished a lesson on the same day while apart: the day's counters add up.
  const sameDay = d => { const p = clone(rec); recordDay(p, { date: '2026-10-07', tracked: 40, known: 3, ...d }); return p; };
  const dayOnline = toDocs(sameDay({ reviews: 15, xp: 100, onTime: 15 }));
  const dayOps = diff(docs, toDocs(sameDay({ reviews: 20, xp: 150, onTime: 18, late: 2, known: 4 })));
  const dayUp = overlay(dayOnline, rebase(dayOps, dayOnline))['2026'].history['2026-10-07'];
  ok('a day studied on both: counters add up, snapshots take the latest',
     dayUp.reviews === 35 && dayUp.xp === 250 && dayUp.onTime === 33 && dayUp.late === 2 && dayUp.known === 4,
     JSON.stringify(dayUp));
  ok('the first day keeps the earliest',
     rebase([{ path: ['main', 'createdAt'], value: '2026-09-01', from: '2026-08-01' }], { main: { createdAt: '2026-07-01' } }).length === 0);
  ok('a deletion goes through as it is',
     same(rebase([{ path: ['main', 'purpose'], del: true, from: 'x' }], { main: { purpose: 'y' } }), [{ path: ['main', 'purpose'], del: true, from: 'x' }]));
  // A batch re-applied, then refused and re-applied again on the next start,
  // against a database that has not moved: its figures must not grow again.
  ok('re-applying a change twice adds it once', same(rebase(rebase(offline, online), online), rebase(offline, online)));

  function get(o, path) { return path.reduce((x, k) => (x && typeof x === 'object' ? x[k] : undefined), o); }
}

// ---------------------------------------------------------------- summary
const el = document.getElementById('sum');
el.className = fail ? 'bad' : 'pass';
el.textContent = `${pass} passed, ${fail} failed`;
window.__RESULTS__ = { pass, fail, results };
console.log(`${pass} passed, ${fail} failed`);
results.filter(r => !r.pass).forEach(r => console.error('FAIL', r.name, r.why));
</script>
